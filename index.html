<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><meta name="description" content="GO DAY 레이브 파티 초대장"><title>CONNECTION / INVITATION</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bitcount+Single+Ink:slnt,wght,ELSH,ELXP@0,400,0,0&display=swap" rel="stylesheet"><style>
:root{--ink:#111;--paper:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:"Bitcount Single Ink",monospace;overflow:hidden}button,input{font:inherit}.stage{height:100vh;display:grid;place-items:center;position:relative}.state-button{appearance:none;border:0;background:transparent;padding:20px;cursor:pointer;display:grid;place-items:center;outline:0}.state-button img{display:block;width:auto;height:clamp(44px,6vw,68px);max-width:none;object-fit:contain}.state-button img.connected{display:none}.state-button:hover img.connecting,.state-button:focus-visible img.connecting{display:none}.state-button:hover img.connected,.state-button:focus-visible img.connected{display:block}.state-button:focus-visible{outline:1px solid #111;outline-offset:14px}.hint{position:absolute;bottom:38px;margin:0;font-size:12px;letter-spacing:.16em;color:#888}.stage.clicked .state-button{pointer-events:none;animation:exit .55s ease forwards}.stage.clicked .hint{opacity:0}@keyframes exit{to{opacity:0;transform:scale(.92)}}.invite{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;visibility:hidden;opacity:0}.invite.show{visibility:visible;opacity:1}.invite-inner{width:min(820px,calc(100% - 40px));text-align:center;display:grid;justify-items:center;gap:44px}.connection-mark{width:min(800px,94vw);height:auto;display:block;opacity:0;transform:translateY(18px) scale(.94);filter:blur(4px)}.invite.show .connection-mark{animation:arrive .8s .15s ease forwards}@keyframes arrive{to{opacity:1;transform:none;filter:blur(0)}}.invite-title{font-size:clamp(1.6rem,4vw,3.6rem);line-height:.9;letter-spacing:.04em;margin:8px 0 0}.invite-date{font-size:clamp(1.2rem,3vw,2.2rem);line-height:1;letter-spacing:.08em;margin:0 0 8px}.name-form{width:min(350px,100%);display:flex;border-bottom:1px solid #111;margin-top:10px;opacity:0}.invite.show .name-form{animation:appear .6s .55s ease forwards}@keyframes appear{to{opacity:1}}.name-form input{width:100%;border:0;background:transparent;text-align:center;padding:10px 4px;color:#111;outline:0;font-size:16px}.name-form input::placeholder{color:#999}.name-form button{border:0;background:none;color:#111;font-size:12px;letter-spacing:.08em;padding:0 4px}.name-form button:hover{color:#888}.welcome{display:none;font-size:16px;margin:6px 0 0}.invite.locked .name-form{display:none}.invite.locked .welcome{display:block}.footnote{position:absolute;bottom:30px;font-size:10px;color:#999;letter-spacing:.12em}@media(max-width:680px){.state-button img{height:44px}.hint{bottom:24px;font-size:10px}.invite-inner{width:calc(100% - 28px);gap:34px}.connection-mark{width:94vw}.invite-title{font-size:clamp(1.5rem,8vw,2.6rem)}.invite-date{font-size:clamp(1.1rem,6vw,1.8rem)}.footnote{bottom:22px}}
</style></head><body><main class="stage" id="stage"><button class="state-button" id="stateButton" type="button" aria-label="연결하기"><img class="connecting" src="assets/connecting.png" alt="CONNECTING..."><img class="connected" src="assets/connected.png" alt="CONNECTED!"></button><p class="hint">MOVE TO CONNECT · CLICK TO ENTER</p></main><section class="invite" id="invite" aria-labelledby="inviteTitle"><div class="invite-inner"><img class="connection-mark" src="assets/layer.png" alt="CONNECTION"><h1 class="invite-title" id="inviteTitle">INVITATION</h1><p class="invite-date">5 NOV 2026,<br>GO DAY</p><form class="name-form" id="nameForm"><input id="name" type="text" placeholder="YOUR NAME" autocomplete="name" aria-label="이름" required><button type="submit">ENTER ↗</button></form><p class="welcome" id="welcome" aria-live="polite"></p></div><p class="footnote">NO SPECTATORS, ONLY PLAYERS.</p></section><script>const stage=document.querySelector('#stage'),button=document.querySelector('#stateButton'),invite=document.querySelector('#invite'),form=document.querySelector('#nameForm'),nameInput=document.querySelector('#name'),welcome=document.querySelector('#welcome');button.addEventListener('click',()=>{stage.classList.add('clicked');invite.classList.add('show')});form.addEventListener('submit',event=>{event.preventDefault();const name=nameInput.value.trim();if(!name)return;welcome.textContent=name+'님, 연결되었습니다.';invite.classList.add('locked')});</script></body></html>
